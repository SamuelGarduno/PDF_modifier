[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coquette-pdf-studio"
version = "1.0.0"
description = "Suite de escritorio offline para manipulación de PDFs con diseño Floral Stationery & Coquette (PySide6 + QtQuick/QML)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.11.1",
    "PyMuPDF>=1.28.2",
    "pypdf>=6.17.0",
    "Pillow>=12.3.0",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-v"

